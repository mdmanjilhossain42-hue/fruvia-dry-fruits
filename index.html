<title>Fruvia — Premium Dry Fruits</title>
<meta name="description" content="Fruvia — Premium dry fruits delivered to your doorstep.">
<style>
:root{--green:#174d3a;--green2:#21634a;--cream:#fbf7ef;--gold:#c99a45;--text:#17231d;--muted:#66736c;--white:#fff;--danger:#b93838;--shadow:0 12px 35px rgba(23,77,58,.10)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Noto Sans Bengali,sans-serif;color:var(--text);background:#fff}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.top{background:var(--green);color:#fff;text-align:center;padding:8px;font-size:13px}.nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #eee}.navin{max-width:1150px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:22px}.logo{font-size:28px;font-weight:900;color:var(--green);letter-spacing:-1px}.logo span{color:var(--gold)}.search{flex:1;display:flex;background:#f5f5f1;border-radius:30px;padding:5px 8px}.search input{width:100%;border:0;background:transparent;padding:10px 14px;outline:0}.search button{background:var(--green);color:#fff;border-radius:50%;width:40px;height:40px}.navlinks{display:flex;gap:16px;align-items:center}.navlinks a{color:var(--text);text-decoration:none;font-weight:600}.cart{background:var(--green);color:#fff;border-radius:25px;padding:10px 15px;font-weight:700}.hero{background:linear-gradient(135deg,#edf5ee,#fff8e8);padding:65px 20px}.heroIn{max-width:1150px;margin:auto;display:grid;grid-template-columns:1.1fr .9fr;gap:35px;align-items:center}.eyebrow{color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:2px}.hero h1{font-size:clamp(40px,6vw,68px);line-height:1.02;margin:12px 0}.hero p{color:var(--muted);font-size:18px;line-height:1.7;max-width:600px}.btn{background:var(--green);color:#fff;padding:13px 20px;border-radius:10px;font-weight:800}.btn.alt{background:#fff;color:var(--green);border:1px solid #d8e3dc}.heroCard{background:#fff;border-radius:28px;padding:35px;box-shadow:var(--shadow);text-align:center}.heroEmoji{font-size:120px}.section{max-width:1150px;margin:auto;padding:55px 20px}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.section h2{font-size:32px;margin:0 0 7px}.muted{color:var(--muted)}.cats{display:flex;gap:10px;overflow:auto;padding-bottom:8px}.chip{padding:10px 16px;border:1px solid #ddd;border-radius:30px;background:#fff;white-space:nowrap}.chip.active{background:var(--green);color:#fff;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{border:1px solid #eee;border-radius:18px;overflow:hidden;background:#fff;transition:.2s;position:relative}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.pic{height:190px;background:linear-gradient(135deg,#f5eee0,#f7f7f0);display:flex;align-items:center;justify-content:center;font-size:80px}.cardbody{padding:16px}.tag{font-size:11px;color:var(--green2);font-weight:800;background:#e9f3ec;padding:5px 8px;border-radius:20px;display:inline-block}.card h3{margin:10px 0 4px}.price{font-weight:900;font-size:20px;color:var(--green)}.old{text-decoration:line-through;color:#999;font-size:13px;margin-left:6px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.add{background:var(--green);color:#fff;border-radius:9px;padding:9px 12px;font-weight:800}.banner{background:var(--green);color:#fff;border-radius:25px;padding:35px;display:flex;justify-content:space-between;align-items:center;gap:20px}.banner h2{margin:0;font-size:32px}.banner .btn{background:#fff;color:var(--green)}.features{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.feature{background:var(--cream);padding:22px;border-radius:16px}.feature b{display:block;margin:8px 0}.footer{background:#102f24;color:#dbe8df;padding:45px 20px;margin-top:20px}.footerIn{max-width:1150px;margin:auto;display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px}.footer h3{color:#fff}.footer a{color:#dbe8df;text-decoration:none;display:block;margin:8px 0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;border-radius:20px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:24px}.close{float:right;background:#f1f1f1;border-radius:50%;width:35px;height:35px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px}.cartitem{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:13px 0}.qty button{width:28px;height:28px;border-radius:6px;background:#eee}.admin{background:#f6f8f5;min-height:100vh}.adminbar{background:var(--green);color:#fff;padding:18px 20px}.adminin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.adminmain{max-width:1100px;margin:auto;padding:25px 20px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{padding:10px 14px;border-radius:8px;background:#fff;border:1px solid #ddd}.tab.active{background:var(--green);color:#fff}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:#fff;padding:20px;border-radius:15px;border:1px solid #e7e7e7}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.danger{background:#fbeaea;color:var(--danger);padding:7px 10px;border-radius:7px}.small{font-size:12px}.empty{text-align:center;padding:35px;color:#777}
@media(max-width:850px){.navlinks a{display:none}.heroIn{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.features{grid-template-columns:repeat(2,1fr)}.footerIn{grid-template-columns:1fr}.adminGrid{grid-template-columns:1fr}}
@media(max-width:520px){.navin{padding:10px 12px;gap:8px}.logo{font-size:24px}.search{display:none}.hero{padding:40px 15px}.section{padding:40px 15px}.grid{grid-template-columns:1fr 1fr;gap:10px}.pic{height:140px;font-size:60px}.cardbody{padding:11px}.card h3{font-size:15px}.price{font-size:17px}.features{grid-template-columns:1fr}.banner{display:block}.banner .btn{margin-top:15px}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const seedProducts=[
{id:1,name:"Premium Cashew",description:"বাছাই করা premium কাজু। মচমচে, তাজা এবং প্রতিদিনের নাস্তা ও অতিথি আপ্যায়নের জন্য উপযুক্ত।",bn:"প্রিমিয়াম কাজু",category:"কাজু",price:650,old:720,weight:"250g",emoji:"🥜",stock:20,featured:true},
{id:2,name:"California Almond",description:"উন্নতমানের California কাঠবাদাম। crunchy texture ও natural flavour-এর জন্য দারুণ।",bn:"ক্যালিফোর্নিয়া কাঠবাদাম",category:"কাঠবাদাম",price:520,old:580,weight:"250g",emoji:"🌰",stock:25,featured:true},
{id:3,name:"Golden Raisins",description:"মিষ্টি ও juicy golden raisins। নাস্তা, dessert ও baking-এর জন্য ব্যবহারযোগ্য।",bn:"গোল্ডেন কিশমিশ",category:"কিশমিশ",price:350,old:390,weight:"250g",emoji:"🫘",stock:30,featured:true},
{id:4,name:"Pistachio Premium",description:"বাছাই করা premium পেস্তা। rich flavour ও crunchy texture-এর জন্য জনপ্রিয়।",bn:"প্রিমিয়াম পেস্তা",category:"পেস্তা",price:780,old:850,weight:"250g",emoji:"🌿",stock:15,featured:true},
{id:5,name:"Medjool Dates",description:"নরম ও মিষ্টি Medjool খেজুর। natural sweetness-এর জন্য উপযুক্ত।",bn:"মেডজুল খেজুর",category:"খেজুর",price:590,old:650,weight:"500g",emoji:"🟤",stock:18,featured:false},
{id:6,name:"Walnut Kernel",description:"পরিষ্কার ও বাছাই করা walnut kernel। নাস্তা ও বিভিন্ন খাবারের সঙ্গে উপভোগ করুন।",bn:"আখরোট",category:"আখরোট",price:720,old:780,weight:"250g",emoji:"🌰",stock:14,featured:false},
{id:7,name:"Premium Mixed Nuts",description:"বিভিন্ন premium nuts-এর সুস্বাদু mix—এক প্যাকে নানা স্বাদ।",bn:"মিক্সড নাটস",category:"মিক্সড",price:690,old:760,weight:"250g",emoji:"🥜",stock:22,featured:true},
{id:8,name:"Dried Cranberry",description:"মিষ্টি-টক dried cranberry। snack, cereal ও dessert-এর সঙ্গে ভালো যায়।",bn:"ড্রাইড ক্র্যানবেরি",category:"ড্রাই ফ্রুট",price:480,old:530,weight:"250g",emoji:"🍒",stock:17,featured:false}
];
let products=JSON.parse(localStorage.getItem("fruvia_products")||"null")||seedProducts;
products=products.map(p=>({...p,description:p.description||"Fruvia-এর বাছাই করা premium dry fruit—fresh, clean এবং যত্নে packed।"}));
let cart=JSON.parse(localStorage.getItem("fruvia_cart")||"[]");
let orders=JSON.parse(localStorage.getItem("fruvia_orders")||"[]");
let category="সব";
function save(){localStorage.setItem("fruvia_products",JSON.stringify(products));localStorage.setItem("fruvia_cart",JSON.stringify(cart));localStorage.setItem("fruvia_orders",JSON.stringify(orders))}
function money(n){return "৳"+Number(n).toLocaleString("bn-BD")}
function render(){
document.getElementById("app").innerHTML=`
<div class="top">🚚 ৳1,000+ অর্ডারে Free Delivery • 100% Fresh & Quality Assured</div>
<nav class="nav"><div class="navin"><div class="logo"><img src="fruvia-logo-cropped.jpg" alt="Fruvia" style="height:52px;width:auto;display:block"></div><div class="search"><input id="search" placeholder="কাজু, বাদাম, খেজুর খুঁজুন..." oninput="renderProducts()"><button>⌕</button></div><div class="navlinks"><a href="#products">Shop</a><a href="#about">About</a><button onclick="openAdmin()" style="background:#f3eee3;color:var(--green);padding:10px 14px;border-radius:25px;font-weight:800">Admin</button><button class="cart" onclick="openCart()">🛒 Cart (<span id="cartCount">${cart.reduce((a,b)=>a+b.qty,0)}</span>)</button></div></div></nav>
<div id="adminQuick" style="position:fixed;right:14px;bottom:14px;z-index:40">
<button onclick="openAdmin()" style="background:#174d3a;color:#fff;padding:13px 18px;border-radius:28px;box-shadow:0 8px 25px rgba(0,0,0,.2);font-weight:800">⚙️ Admin</button>
</div>
<header class="hero"><div class="heroIn"><div><div class="eyebrow">Premium • Fresh • Natural</div><h1>ভালোবাসা মেশানো<br><span style="color:var(--green)">স্বাদের বাজার</span></h1><p>Fruvia নিয়ে এলো বাছাই করা premium dry fruits—সতেজ, পরিষ্কার ও যত্নে প্যাক করা। আপনার ঘরের জন্য ভালো কিছু।</p><button class="btn" onclick="document.getElementById('products').scrollIntoView()">এখনই শপ করুন →</button></div><div class="heroCard"><div class="heroEmoji">🥜🌰🍇</div><h3>Premium Dry Fruits</h3><p class="muted">Freshly packed • Hygienic • Delivered</p></div></div></header>
<section class="section"><div class="features"><div class="feature">🌿<b>Fresh Quality</b><span class="muted">বাছাই করা পণ্য</span></div><div class="feature">📦<b>Secure Packing</b><span class="muted">পরিষ্কার প্যাকেজিং</span></div><div class="feature">🚚<b>Fast Delivery</b><span class="muted">দ্রুত ডেলিভারি</span></div><div class="feature">💚<b>Trusted Service</b><span class="muted">সন্তুষ্টিই লক্ষ্য</span></div></div></section>
<section class="section" id="products"><div class="sectionHead"><div><h2>Best Sellers</h2><div class="muted">আপনার পছন্দের dry fruits</div></div></div><div class="cats" id="cats"></div><br><div class="grid" id="productGrid"></div></section>
<section class="section"><div class="banner"><div><div class="eyebrow" style="color:#e8c77e">Fruvia Special</div><h2>৳1,000+ অর্ডারে Free Delivery</h2><p>আজই আপনার পছন্দের dry fruits অর্ডার করুন।</p></div><button class="btn" onclick="document.getElementById('products').scrollIntoView()">Shop Now</button></div></section>
<section class="section" id="about"><div class="sectionHead"><div><h2>Why Fruvia?</h2><div class="muted">আপনার পরিবারের জন্য ভালো মানের dry fruits</div></div></div><p style="line-height:1.8;color:var(--muted);max-width:800px">Fruvia একটি modern dry fruit store concept—যেখানে quality, clean packaging এবং সহজ online shopping experience-কে গুরুত্ব দেওয়া হয়েছে।</p></section>
<footer class="footer"><div class="footerIn"><div><div class="logo"><img src="fruvia-logo-cropped.jpg" alt="Fruvia" style="height:62px;width:auto;display:block;"></div><p>Premium dry fruits, delivered with care.</p></div><div><h3>Shop</h3><a href="#products">All Products</a><a href="#products">Best Sellers</a></div><div><h3>Contact</h3><p>📞 01XXXXXXXXX</p><p>📍 Bangladesh</p><p>✉️ hello@fruvia.com</p></div></div></footer>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"></div>`;
renderCats();renderProducts();
}
function renderCats(){
let cats=["সব",...new Set(products.map(p=>p.category))];
document.getElementById("cats").innerHTML=cats.map(c=>`<button class="chip ${category===c?'active':''}" onclick="category='${c.replace(/'/g,"\\'")}';renderCats();renderProducts()">${c}</button>`).join("");
}
function renderProducts(){
let q=(document.getElementById("search")?.value||"").toLowerCase();
let list=products.filter(p=>(category==="সব"||p.category===category)&&((p.name+p.bn+p.category).toLowerCase().includes(q)));
document.getElementById("productGrid").innerHTML=list.length?list.map(p=>`<article class="card"><div class="pic">${p.image?`<img src="${p.image}" alt="${p.bn}" style="width:100%;height:100%;object-fit:cover">`:p.emoji}</div><div class="cardbody"><span class="tag">${p.weight}</span><h3>${p.bn}</h3><div class="muted small">${p.name}</div><p class="muted small" style="line-height:1.5;margin:8px 0">${p.description||""}</p><div class="row" style="margin-top:12px"><div><span class="price">${money(p.price)}</span><span class="old">${money(p.old)}</span></div><div style="display:flex;gap:6px"><button class="tab" onclick="viewProduct(${p.id})">Details</button><button class="add" onclick="addToCart(${p.id})">+ Add</button></div></div></div></article>`).join(""):`<div class="empty" style="grid-column:1/-1">কোনো product পাওয়া যায়নি।</div>`;
}
function addToCart(id){let p=products.find(x=>x.id===id);let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id,qty:1});save();renderCartCount();toast("Cart-এ যোগ হয়েছে ✓")}
function renderCartCount(){let el=document.getElementById("cartCount");if(el)el.textContent=cart.reduce((a,b)=>a+b.qty,0)}
function viewProduct(id){
let p=products.find(x=>x.id===id); if(!p)return;
showModal(`<button class="close" onclick="closeModal()">×</button>
<div style="text-align:center"><div style="height:250px;border-radius:16px;background:#f7f2e8;display:flex;align-items:center;justify-content:center;overflow:hidden">${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover">`:`<span style="font-size:110px">${p.emoji||"🥜"}</span>`}</div></div>
<h2 style="margin-bottom:5px">${p.bn}</h2><div class="muted">${p.name} • ${p.weight}</div>
<p style="line-height:1.7;color:#66736c">${p.description||""}</p>
<div class="row"><b class="price">${money(p.price)}</b><button class="btn" onclick="addToCart(${p.id});closeModal()">Add to Cart</button></div>`);
}
function openCart(){
let rows=cart.map(x=>{let p=products.find(p=>p.id===x.id);return p?`<div class="cartitem"><div><b>${p.bn}</b><div class="muted">${p.weight} • ${money(p.price)}</div></div><div class="qty"><button onclick="changeQty(${p.id},-1)">−</button> <b>${x.qty}</b> <button onclick="changeQty(${p.id},1)">+</button></div></div>`:""}).join("");
let total=cart.reduce((s,x)=>s+(products.find(p=>p.id===x.id)?.price||0)*x.qty,0);
showModal(`<button class="close" onclick="closeModal()">×</button><h2>আপনার Cart</h2>${rows||'<div class="empty">Cart এখনো খালি।</div>'}<hr><div class="row"><b>Total</b><b class="price">${money(total)}</b></div>${cart.length?`<button class="btn" style="width:100%;margin-top:15px" onclick="checkout()">Checkout →</button>`:""}`);
}
function changeQty(id,d){let x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(a=>a.id!==id);save();openCart();renderCartCount()}
function checkout(){
let total=cart.reduce((s,x)=>s+(products.find(p=>p.id===x.id)?.price||0)*x.qty,0);
showModal(`<button class="close" onclick="closeModal()">×</button><h2>Checkout</h2><div class="field"><label>নাম</label><input id="cname" placeholder="আপনার নাম"></div><div class="field"><label>মোবাইল</label><input id="cphone" placeholder="01XXXXXXXXX"></div><div class="field"><label>ঠিকানা</label><textarea id="caddress" rows="3" placeholder="বাড়ি, রোড, এলাকা, জেলা"></textarea></div><div class="field"><label>Payment</label><select id="cpay"><option>Cash on Delivery</option><option>bKash / Nagad (ম্যানুয়াল)</option></select></div><p><b>Order Total: ${money(total)}</b></p><button class="btn" style="width:100%" onclick="placeOrder()">Place Order</button>`);
}
function placeOrder(){
let name=document.getElementById("cname").value.trim(),phone=document.getElementById("cphone").value.trim(),address=document.getElementById("caddress").value.trim(),pay=document.getElementById("cpay").value;
if(!name||!phone||!address){alert("সব তথ্য পূরণ করুন");return}
let items=cart.map(x=>{let p=products.find(p=>p.id===x.id);return {name:p.bn,qty:x.qty,price:p.price}});
orders.unshift({id:"FV"+Date.now().toString().slice(-7),date:new Date().toLocaleString("bn-BD"),name,phone,address,pay,items,total:items.reduce((s,x)=>s+x.qty*x.price,0),status:"নতুন"});
cart=[];save();closeModal();renderCartCount();alert("অর্ডার সফল হয়েছে! Order ID: "+orders[0].id);
}
function showModal(html){let m=document.getElementById("modal");m.innerHTML=`<div class="box">${html}</div>`;m.classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function toast(t){let x=document.createElement("div");x.textContent=t;x.style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#174d3a;color:white;padding:12px 18px;border-radius:25px;z-index:99";document.body.appendChild(x);setTimeout(()=>x.remove(),1500)}
function openAdmin(){
showModal(`<button class="close" onclick="closeModal()">×</button><h2>Fruvia Admin</h2><p class="muted">Demo admin access. Live site-এ server-side login ব্যবহার করা উচিত।</p><div class="field"><label>Password</label><input id="apass" type="password" placeholder="demo123"></div><button class="btn" onclick="adminLogin()">Login</button>`);
}
function adminLogin(){if(document.getElementById("apass").value!=="demo123"){alert("Demo password: demo123");return}closeModal();renderAdmin()}
function renderAdmin(){
document.body.innerHTML=`<div class="admin"><div class="adminbar"><div class="adminin"><b style="font-size:24px">Fruvia Admin</b><button class="btn alt" onclick="location.reload()">← Shop</button></div></div><main class="adminmain"><div class="tabs"><button class="tab active" onclick="adminTab('products')">Products</button><button class="tab" onclick="adminTab('orders')">Orders (${orders.length})</button><button class="tab" onclick="adminTab('settings')">Settings</button></div><div id="adminContent"></div></main></div>`;adminTab("products")
}
function adminTab(tab){
let c=document.getElementById("adminContent");
if(tab==="products")c.innerHTML=`<div class="adminGrid"><div class="panel"><h2>Add Product</h2><div class="field"><label>Product name (Bangla)</label><input id="pn"></div><div class="field"><label>English name</label><input id="pe"></div><div class="field"><label>Category</label><input id="pc"></div><div class="field"><label>Price</label><input id="pp" type="number"></div><div class="field"><label>Old price</label><input id="po" type="number"></div><div class="field"><label>Weight</label><input id="pw" placeholder="250g"></div><div class="field"><label>Description</label><textarea id="pd" rows="4" placeholder="Product সম্পর্কে সংক্ষিপ্ত বর্ণনা"></textarea></div><div class="field"><label>Stock</label><input id="ps" type="number" value="10"></div><div class="field"><label>📷 Product Image</label>

</div>

}
let adminImageData="";
function previewAdminImage(e){
  const file=e.target.files && e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith("image/")){ alert("শুধু image file দিন"); e.target.value=""; return; }
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const max=1000, scale=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*scale));
      c.height=Math.max(1,Math.round(img.height*scale));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      adminImageData=c.toDataURL("image/jpeg",0.82);
      const prev=document.getElementById("imgPreview");
      if(prev) prev.innerHTML='<img src="'+adminImageData+'" style="width:120px;height:120px;object-fit:cover;border-radius:12px;border:1px solid #ddd">';
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function adminAdd(){
  let p={
    id:Date.now(),
    name:document.getElementById("pn").value.trim(),
    bn:document.getElementById("pn").value.trim(),
    category:document.getElementById("pc").value.trim()||"অন্যান্য",
    price:+document.getElementById("pp").value,
    old:+document.getElementById("po").value||+document.getElementById("pp").value,
    weight:document.getElementById("pw").value.trim()||"250g",description:document.getElementById("pd").value.trim()||"Fruvia-এর premium dry fruit—fresh, clean এবং যত্নে packed.",
    emoji:document.getElementById("px").value||"🥜",
    image:adminImageData||"",
    stock:+document.getElementById("ps").value||0,
    featured:false
  };
  if(!p.bn||!p.price){alert("Name এবং Price দিন");return;}
  try{
    products.push(p); save(); adminImageData=""; adminTab("products");
    alert("Product সফলভাবে যোগ হয়েছে ✓");
  }catch(err){
    products=products.filter(x=>x.id!==p.id);
    alert("ছবিটি অনেক বড়। ছোট ছবি দিয়ে আবার চেষ্টা করুন।");
  }
}
function adminDelete(id){if(confirm("Delete this product?")){products=products.filter(p=>p.id!==id);save();adminTab("products")}}
function setStatus(id,s){let o=orders.find(x=>x.id===id);if(o){o.status=s;save()}}
render();
document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==="a")openAdmin()});
</script>
